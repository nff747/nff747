<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60px">
  <style>
    .bg { fill: #05080D; }
    .text { font-family: monospace; font-size: 18px; fill: #F0F6FC; font-weight: bold; letter-spacing: 2px; }
    .accent { fill: #FF0055; }
    .scanlines { fill: url(#scanlinePattern); opacity: 0.15; pointer-events: none; }
  </style>
  <defs>
    <pattern id="scanlinePattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <rect width="100%" height="100%" class="scanlines"/>
  <rect x="10" y="15" width="4" height="30" class="accent"/>
  <text x="30" y="36" class="text"><tspan class="accent">▸</tspan> FLAGSHIP ENGINES</text>
</svg>
