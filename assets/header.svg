<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200px">
  <style>
    .bg { fill: #05080D; }
    .text { font-family: monospace; font-size: 14px; fill: #F0F6FC; white-space: pre; }
    .accent { fill: #FF0055; }
    .muted { fill: #8B949E; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scanlines { fill: url(#scanlinePattern); opacity: 0.15; pointer-events: none; }
  </style>
  <defs>
    <pattern id="scanlinePattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <rect width="100%" height="100%" class="scanlines"/>
  <g transform="translate(40, 50)">
    <text class="text" font-weight="bold">NFF-747 SYSTEMS // INITIALIZING<tspan class="cursor">_</tspan></text>
    <g transform="translate(0, 40)">
      <text class="text"><tspan class="accent">&gt;</tspan> arch: WebGPU / WGSL / Rust / TypeScript</text>
    </g>
    <g transform="translate(0, 70)">
      <text class="text"><tspan class="accent">&gt;</tspan> domain: GPU compute, edge inference, browser runtimes</text>
    </g>
    <g transform="translate(0, 100)">
      <text class="text"><tspan class="accent">&gt;</tspan> status: OPERATIONAL</text>
    </g>
  </g>
</svg>
