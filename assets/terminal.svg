<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <filter id="tglow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- TERMINAL WINDOW -->
  <rect x="0" y="0" width="800" height="380" rx="8" fill="#0D1117" stroke="#1a1f2b" stroke-width="1.5"/>
  
  <!-- TITLE BAR -->
  <rect x="0" y="0" width="800" height="36" rx="8" fill="#161B22"/>
  <rect x="0" y="20" width="800" height="16" fill="#161B22"/>
  
  <!-- WINDOW DOTS -->
  <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="6" fill="#28C840"/>
  
  <!-- TITLE BAR TEXT -->
  <text x="400" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">iKi@frozen-flame: ~/identity</text>

  <!-- BLINKING CURSOR LINE 1 -->
  <g filter="url(#tglow)">
    <text x="20" y="70" font-family="monospace" font-size="13" fill="#FF0055">❯</text>
    <text x="40" y="70" font-family="monospace" font-size="13" fill="#c9d1d9">cat ./manifest.json</text>
  </g>

  <!-- JSON OUTPUT -->
  <text x="20" y="100" font-family="monospace" font-size="12.5" fill="#8b949e">{</text>
  
  <text x="40" y="122" font-family="monospace" font-size="12.5" fill="#FF0055">"alias"</text>
  <text x="105" y="122" font-family="monospace" font-size="12.5" fill="#8b949e">:</text>
  <text x="120" y="122" font-family="monospace" font-size="12.5" fill="#79c0ff">"iKi"</text>
  <text x="160" y="122" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>

  <text x="40" y="144" font-family="monospace" font-size="12.5" fill="#FF0055">"studio"</text>
  <text x="120" y="144" font-family="monospace" font-size="12.5" fill="#8b949e">:</text>
  <text x="135" y="144" font-family="monospace" font-size="12.5" fill="#79c0ff">"Frozen Flame"</text>
  <text x="268" y="144" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>

  <text x="40" y="166" font-family="monospace" font-size="12.5" fill="#FF0055">"role"</text>
  <text x="97" y="166" font-family="monospace" font-size="12.5" fill="#8b949e">:</text>
  <text x="112" y="166" font-family="monospace" font-size="12.5" fill="#79c0ff">"Senior Creative Developer"</text>
  <text x="372" y="166" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>

  <text x="40" y="188" font-family="monospace" font-size="12.5" fill="#FF0055">"stack"</text>
  <text x="105" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">: [</text>
  <text x="130" y="188" font-family="monospace" font-size="12.5" fill="#79c0ff">"WebGL"</text>
  <text x="182" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="195" y="188" font-family="monospace" font-size="12.5" fill="#79c0ff">"Three.js"</text>
  <text x="274" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="287" y="188" font-family="monospace" font-size="12.5" fill="#79c0ff">"GLSL"</text>
  <text x="332" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="345" y="188" font-family="monospace" font-size="12.5" fill="#79c0ff">"React"</text>
  <text x="398" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="411" y="188" font-family="monospace" font-size="12.5" fill="#79c0ff">"TypeScript"</text>
  <text x="510" y="188" font-family="monospace" font-size="12.5" fill="#8b949e">],</text>

  <text x="40" y="210" font-family="monospace" font-size="12.5" fill="#FF0055">"pipeline"</text>
  <text x="127" y="210" font-family="monospace" font-size="12.5" fill="#8b949e">: [</text>
  <text x="152" y="210" font-family="monospace" font-size="12.5" fill="#79c0ff">"Blender"</text>
  <text x="224" y="210" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="237" y="210" font-family="monospace" font-size="12.5" fill="#79c0ff">"AI Rigging"</text>
  <text x="338" y="210" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>
  <text x="351" y="210" font-family="monospace" font-size="12.5" fill="#79c0ff">"Procedural Gen"</text>
  <text x="490" y="210" font-family="monospace" font-size="12.5" fill="#8b949e">],</text>

  <text x="40" y="232" font-family="monospace" font-size="12.5" fill="#FF0055">"gpu_status"</text>
  <text x="142" y="232" font-family="monospace" font-size="12.5" fill="#8b949e">:</text>
  <text x="157" y="232" font-family="monospace" font-size="12.5" fill="#3fb950">"ACTIVE"</text>
  <text x="224" y="232" font-family="monospace" font-size="12.5" fill="#8b949e">,</text>

  <text x="40" y="254" font-family="monospace" font-size="12.5" fill="#FF0055">"philosophy"</text>
  <text x="150" y="254" font-family="monospace" font-size="12.5" fill="#8b949e">:</text>
  <text x="165" y="254" font-family="monospace" font-size="12.5" fill="#79c0ff">"The screen is a portal. The shader is the soul."</text>

  <text x="20" y="276" font-family="monospace" font-size="12.5" fill="#8b949e">}</text>

  <!-- COMMAND PROMPT 2 -->
  <g filter="url(#tglow)">
    <text x="20" y="310" font-family="monospace" font-size="13" fill="#FF0055">❯</text>
    <text x="40" y="310" font-family="monospace" font-size="13" fill="#c9d1d9">echo $CURRENT_MISSION</text>
  </g>
  <text x="20" y="335" font-family="monospace" font-size="12.5" fill="#3fb950">
    Forging GPU-accelerated dark-mode universes that melt screens.
  </text>

  <!-- BLINKING CURSOR -->
  <rect x="20" y="352" width="8" height="16" fill="#FF0055">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
