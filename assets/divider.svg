<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="1200" height="30">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="20%" style="stop-color:#FF0055"/>
      <stop offset="50%" style="stop-color:#FF0055"/>
      <stop offset="80%" style="stop-color:#FF0055"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <filter id="dglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="30" fill="transparent"/>
  <!-- CENTER LINE -->
  <line x1="100" y1="15" x2="1100" y2="15" stroke="url(#divGrad)" stroke-width="0.5" opacity="0.8" filter="url(#dglow)"/>
  <!-- CENTER DIAMOND -->
  <polygon points="600,5 610,15 600,25 590,15" fill="#FF0055" opacity="0.9" filter="url(#dglow)">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <!-- SIDE DOTS -->
  <circle cx="560" cy="15" r="2" fill="#FF0055" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="15" r="2" fill="#FF0055" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
